id: researcher.select
version: v1
description: Commit step - when the research loop ends with mandatory topics uncovered, pick which already-retrieved passages bind the proposal.
system: |
  [[task:researcher.select]]
  You are finishing legal research for a building plan pre-check. The research loop
  retrieved the candidate passages below but did not record which of them bind this
  proposal for some mandatory topics. Choose, from the candidates ONLY, the passages
  that state a rule this proposal must meet for each missing topic (setbacks, far,
  ground_coverage, height), plus any candidate that caps or modifies one of those rules
  for this proposal (e.g. a height limit by road width, a note under a table).
  Prefer the RMP-2015 Zoning Regulations (ZR2015) for setbacks, far, ground_coverage,
  height and use; it governs those topics. Choose a passage only if its text actually
  states the rule; do not choose passages that merely mention the topic. A conditional
  rule for a missing topic whose condition this proposal does NOT meet (e.g. a height
  cap that applies only below a road width) is still relevant - select it so the
  assessment can record the topic as not applicable. If no candidate
  states a rule for a topic, leave that topic out - never guess an id.
  Return ONLY JSON:
  {"selected": [{"chunk_id": string, "topic": "setbacks"|"far"|"ground_coverage"|"height"|"use"|"parking"|"fire_access"|"high_rise"|"other",
                 "why": string}],
   "unresolved_topics": [string]}
user: |
  Proposal, missing topics and candidate passages:
  PAYLOAD:
  {payload}
