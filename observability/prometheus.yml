global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: retriever
    static_configs: [{targets: ["retriever:8001"]}]
  - job_name: llm-gateway
    static_configs: [{targets: ["llm-gateway:8002"]}]
  - job_name: llm-stub
    static_configs: [{targets: ["llm-stub:8003"]}]
  # Workers are scaled with --scale; Docker DNS returns one A record per replica.
  - job_name: researcher
    dns_sd_configs: [{names: ["researcher"], type: A, port: 9100, refresh_interval: 15s}]
  - job_name: assessor
    dns_sd_configs: [{names: ["assessor"], type: A, port: 9100, refresh_interval: 15s}]
  - job_name: docker-stats
    static_configs: [{targets: ["docker-stats:9101"]}]
  - job_name: jaeger
    static_configs: [{targets: ["jaeger:14269"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
